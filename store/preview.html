<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore real screenshots of an ESSENTIAL website template.">
  <meta name="theme-color" content="#111111">
  <title>Template preview — ESSENTIAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/preview.css">
  <script src="js/products.js" defer></script>
  <script src="js/payment-links.js" defer></script>
  <script src="js/site-previews.js" defer></script>
  <script src="js/preview-page.js" defer></script>
</head>
<body class="preview-page-body">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="preview-page-header">
    <a class="preview-wordmark" href="index.html" aria-label="ESSENTIAL home">ESSENTIAL</a>
    <div class="store-language-control" role="group" aria-label="Choose language / Elige idioma"><button id="languageEN" type="button" aria-pressed="true">EN</button><button id="languageES" type="button" aria-pressed="false">ES</button></div>
  </header>
  <a class="preview-back" href="index.html#collection" data-copy="back">← Back to collection</a>
  <main class="preview-page-main" id="main">
    <p class="preview-breadcrumb"><span data-copy="collection">COLLECTION</span><span aria-hidden="true">/</span><span id="productType">TEMPLATE PREVIEW</span></p>
    <section class="preview-intro" aria-labelledby="productTitle">
      <div><p class="preview-eyebrow" id="productTag"></p><h1 id="productTitle"></h1><p class="preview-description" id="productDescription"></p></div>
      <p class="preview-price" id="productPrice"></p>
    </section>
    <p class="preview-screen-reader-note" id="previewDescription"></p>
    <div id="previewArt"></div>
    <div id="templateSections"></div>
    <section class="preview-actions" aria-label="Purchase and contact actions">
      <div id="previewPurchase"></div>
      <a class="preview-question" id="previewQuestion" href="#" data-copy="question">Ask a question</a>
      <p class="preview-delivery-note" data-copy="delivery">After checkout, your payment provider emails the download link automatically.</p>
    </section>
  </main>
  <footer class="preview-page-footer"><span>ESSENTIAL · <span data-copy="footer">Independent website templates</span></span><a href="image-credits.md" data-copy="credits">Photo credits</a></footer>
</body>
</html>
